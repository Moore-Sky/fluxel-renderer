[package]
name = "fluxel-windows-dx12-harness"
version = "0.8.2"
edition = "2024"
publish = false

[workspace]

# This deliberately remains an independent manifest until the temporary proof
# harness has a settled renderer-facing API.  It must not become a workspace
# platform crate.

[dependencies]
fluxel-renderer = { path = "../../crates/renderer", features = ["gpu-upload"] }
fluxel-rhi = { path = "../../crates/rhi", features = ["dx12", "test-support"] }
fluxel-host = { path = "../../../fluxel-host" }

[patch.crates-io]
# Keep this proof harness on the workspace's validation-fixed HAL source.
wgpu-hal = { path = "../../vendor/wgpu-hal-30.0.1" }

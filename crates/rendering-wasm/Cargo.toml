[package]
name = "fluxel-rendering-wasm"
version.workspace = true
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false
description = "Narrow wasm-bindgen binding for Fluxel's retained WebGL2 scene"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fluxel-renderer = { path = "../renderer", features = ["gpu-upload"] }
fluxel-rhi = { path = "../rhi", default-features = false, features = ["webgl2"] }
js-sys = "0.3.77"
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.77", features = ["HtmlCanvasElement"] }
